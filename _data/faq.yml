- q: "Who can apply?"
  a: "The hackathon is open to all career stages. Priority for travel support will be given to early-career researchers (within 10 years of PhD)."
- q: "When is the application deadline?"
  a: "October 24th, 2026."
- q: "How are participants selected?"
  a: "Capacity at each hub is limited. If we receive more applications than places, we will select participants based on career stage and the relevance of their interests and proposed research to the hackathon goals."
- q: "Is travel support available?"
  a: "A limited amount of travel support is available thanks to Spark Climate Solutions and the CMIP IPO. Priority will be given to early-career researchers (within 10 years of PhD). If requests exceed available funding, support will be allocated using the same criteria as participant selection."
