# Site settings — edit these first.
title: CLIVAR CMIP7 Hackathon
description: >-
  A three-day, in-person hackathon analyzing how the new generation of CMIP7
  models represents historical trends and multidecadal variability, held at
  hubs in Boulder, Taipei, and Tokyo.

# The repo lives under a personal GitHub account, so set this to "/<repo-name>",
# e.g. "/clivar-cmip7-hackathon". Leave empty only for a <name>.github.io repo.
baseurl: "/CMIP7_hackathon_2027"
url: "https://ncar.github.io"

# While true, a banner says the site is under construction and search engines
# are asked not to index it. Set to false when the site is ready to launch.
under_construction: true

# Event details shown on the home page. Anything marked TBD is a placeholder.
event:
  dates: "January 6–8, 2027"
  format: "In person at three hubs"
  location: "Boulder · Taipei · Tokyo"
  application_deadline: "October 24th, 2026"
  decision_deadline: "October 31st, 2026"
  organized_by: "the CLIVAR CEMT-MV Research Focus"

markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - information.txt
